name: Sync upstream default branch

# Dynamically tracks diegosouzapw/OmniRoute's current default branch
# (latest release/vX.Y.Z) and merges it into `anyroute`.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: anyroute
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/diegosouzapw/OmniRoute.git
          git fetch upstream --prune

      - name: Resolve upstream default branch
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=$(gh api repos/diegosouzapw/OmniRoute --jq .default_branch)
          SHA=$(git rev-parse "upstream/${DEFAULT_BRANCH}")
          SHORT=$(git rev-parse --short "upstream/${DEFAULT_BRANCH}")
          {
            echo "branch=${DEFAULT_BRANCH}"
            echo "sha=${SHA}"
            echo "short=${SHORT}"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream default: ${DEFAULT_BRANCH} @ ${SHORT}"

      - name: Merge upstream default into anyroute
        id: merge
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout anyroute
          git reset --hard origin/anyroute

          BEFORE=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "anyroute already contains upstream/${UPSTREAM_BRANCH} — nothing to merge"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit "$UPSTREAM_SHA"; then
            echo "::error::Merge conflict while syncing upstream/${UPSTREAM_BRANCH} into anyroute. Resolve manually."
            git merge --abort || true
            exit 1
          fi

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin anyroute
          fi

      # Upstream ships many CI workflows; keep only Docker + this sync job enabled.
      - name: Strip Dependabot + disable non-allowlisted workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git checkout anyroute
          git reset --hard origin/anyroute

          if [ -f .github/dependabot.yml ]; then
            git rm -f .github/dependabot.yml
            git commit -m "ci: remove Dependabot config after upstream sync"
            git push origin anyroute
          fi

          KEEP_REGEX='^(Build and Push Anyroute Docker Image|Sync upstream default branch)$'
          while IFS=$'\t' read -r name id state; do
            if printf '%s' "$name" | grep -Eq "$KEEP_REGEX"; then
              echo "KEEP  $name"
              continue
            fi
            if [ "$state" = "active" ]; then
              echo "DISABLE $name"
              gh workflow disable "$id" --repo "$REPO" || true
            else
              echo "already disabled: $name"
            fi
          done < <(gh workflow list --repo "$REPO" --json name,id,state \
            --jq '.[] | [.name, (.id|tostring), .state] | @tsv')

      - name: Summary
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHORT: ${{ steps.upstream.outputs.short }}
          CHANGED: ${{ steps.merge.outputs.changed }}
        run: |
          {
            echo "## Upstream sync"
            echo ""
            echo "- Upstream default branch: \`${UPSTREAM_BRANCH}\`"
            echo "- Upstream tip: \`${UPSTREAM_SHORT}\`"
            echo "- Merged into \`anyroute\`: \`${CHANGED:-false}\`"
            echo "- Non-allowlisted workflows re-disabled"
          } >> "$GITHUB_STEP_SUMMARY"
