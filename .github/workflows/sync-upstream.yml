name: Sync upstream default branch

# Mirrors diegosouzapw/OmniRoute's *current* default branch onto `main`.
# Does NOT merge into `anyroute` — you merge main → anyroute yourself when ready.
on:
  schedule:
    # Once per day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: anyroute
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/diegosouzapw/OmniRoute.git
          git fetch upstream --prune

      - name: Resolve upstream default branch
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=$(gh api repos/diegosouzapw/OmniRoute --jq .default_branch)
          SHA=$(git rev-parse "upstream/${DEFAULT_BRANCH}")
          SHORT=$(git rev-parse --short "upstream/${DEFAULT_BRANCH}")
          {
            echo "branch=${DEFAULT_BRANCH}"
            echo "sha=${SHA}"
            echo "short=${SHORT}"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream default: ${DEFAULT_BRANCH} @ ${SHORT}"

      - name: Update main (upstream mirror only)
        id: mirror
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          BEFORE=""
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            BEFORE=$(git rev-parse origin/main)
          fi

          git checkout -B main "$UPSTREAM_SHA"
          git push --force origin main

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "main now mirrors upstream/${UPSTREAM_BRANCH} @ $(git rev-parse --short HEAD)"

      # Keep only Docker + this sync job enabled (anyroute is the default branch).
      - name: Disable non-allowlisted workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEEP_REGEX='^(Build and Push Anyroute Docker Image|Sync upstream default branch)$'
          while IFS=$'\t' read -r name id state; do
            if printf '%s' "$name" | grep -Eq "$KEEP_REGEX"; then
              echo "KEEP  $name"
              continue
            fi
            if [ "$state" = "active" ]; then
              echo "DISABLE $name"
              gh workflow disable "$id" --repo "$REPO" || true
            else
              echo "already disabled: $name"
            fi
          done < <(gh workflow list --repo "$REPO" --json name,id,state \
            --jq '.[] | [.name, (.id|tostring), .state] | @tsv')

      - name: Summary
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHORT: ${{ steps.upstream.outputs.short }}
          CHANGED: ${{ steps.mirror.outputs.changed }}
        run: |
          {
            echo "## Upstream sync"
            echo ""
            echo "- Upstream default branch: \`${UPSTREAM_BRANCH}\`"
            echo "- Upstream tip: \`${UPSTREAM_SHORT}\`"
            echo "- \`main\` mirror updated: \`${CHANGED:-false}\`"
            echo "- \`anyroute\` was **not** merged (do that manually when ready)"
          } >> "$GITHUB_STEP_SUMMARY"
