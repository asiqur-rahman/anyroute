name: Build and Push Anyroute Docker Image

on:
  push:
    branches:
      - anyroute
  workflow_dispatch:

env:
  IMAGE: asiqurrahman/anyroute

permissions:
  contents: read
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Cap the Node build heap below the Dockerfile default (4096) so the
      # standard GitHub runner (~7 GB) is not OOM-killed mid-build.
      - name: Build + push anyroute
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner-base
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=3072
          cache-from: type=gha,scope=anyroute-amd64
          cache-to: type=gha,scope=anyroute-amd64,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
